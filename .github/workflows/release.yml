name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore: [README.md, VALIDATION.md, docs/guide.md, docs/build.md]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  QT_VERSION: '6.8.3'
  # The tag being built: part of every release file name (scripts/names.py); empty on an ordinary build
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: meta
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py metadata

  linux:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: raspberry
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 25
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake ninja-build qt6-base-dev libqt6opengl6-dev libgl1-mesa-dev dpkg-dev file python3
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/pxs-qt (the look)
      - name: Build and test natively
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDMXPULSE_VERSION="$APP_VERSION"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure --timeout 90
      - name: Package and install Debian package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          (cd build && cpack -G DEB)
          cp build/dmxpulse_*.deb "dist/$(python3 scripts/names.py linux "$ARCH" .deb)"
          apt-get install -y ./dist/*.deb
          DMXPulse --smoke-test -platform offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/*
            build/window-test.txt
            build/levelcontrol-test.txt

  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the version in the application's name counts commits since the last release
          submodules: recursive # third_party/pxs-qt
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build and test
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          APP_ARCH: ${{ matrix.arch }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$APP_ARCH" -DDMXPULSE_VERSION="$APP_VERSION"
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --timeout 90
      - name: Bundle, verify and smoke-test packages
        env:
          APP_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/package_desktop.py macos --arch "$APP_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-macos-${{ matrix.arch }}
          path: |
            build/Testing/Temporary/*
            build/window-test.txt
            build/levelcontrol-test.txt

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the version in the application's name counts commits since the last release
          submodules: recursive # third_party/pxs-qt
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Build and test
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDMXPULSE_VERSION="$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure --timeout 90
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Qt and MSVC runtime, build and start the installer
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_desktop.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows
          path: |
            build/Testing/Temporary/*
            build/window-test.txt
            build/levelcontrol-test.txt

  sanitizers:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/pxs-qt (the look)
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev ninja-build
      - name: Address and undefined-behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 3
          ctest --test-dir build-sanitize --output-on-failure --timeout 90

  release:
    if: github.ref_type == 'tag'
    needs: [metadata, linux, macos, windows, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Validate complete package set
        run: python3 scripts/release.py verify
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DMXPulse $RELEASE_TAG" --generate-notes
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          from release import stale_assets, verify
          tag = os.environ["RELEASE_TAG"]
          packages = verify("dist")
          subprocess.run(["gh", "release", "upload", tag, *map(str, packages), "--clobber"], check=True)
          release = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--json", "assets"], text=True))
          for name in stale_assets([asset["name"] for asset in release["assets"]], "dist"):
              subprocess.run(["gh", "release", "delete-asset", tag, name, "--yes"], check=True)
          PY
          gh release edit "$RELEASE_TAG" --draft=false

  # The README download badges and VERSION follow the latest complete release
  downloads:
    needs: release
    permissions:
      contents: write
    uses: PixelStereo/pxs-qt/.github/workflows/release-downloads.yml@v0.37.1
    with: { app: DMXPulse, platforms: "mac,win,linux,rpi", pxs-ref: v0.37.1 }
